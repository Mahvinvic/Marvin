<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marvin" />
    <title>Marvin — Personal Growth</title>
    <style>
      /* Boot splash: painted before any JS/CSS bundle loads, so there's no
         white flash while the app boots. main.jsx fades it out once React
         has mounted. Mirrors the dark/chrome/cyan mark in favicon.svg. */
      html, body {
        background: #0a0a0a;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        overflow: hidden;
        background: radial-gradient(120% 120% at 50% 40%, #1a1a1a 0%, #0a0a0a 60%, #060606 100%);
        transition: opacity 0.4s ease;
        padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash::before,
      #boot-splash::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
      }
      #boot-splash::before {
        width: 320px;
        height: 320px;
        top: -60px;
        left: -80px;
        background: radial-gradient(circle, rgba(0, 255, 255, 0.16), transparent 70%);
      }
      #boot-splash::after {
        width: 380px;
        height: 380px;
        bottom: -100px;
        right: -100px;
        background: radial-gradient(circle, rgba(120, 150, 170, 0.18), transparent 70%);
      }
      #boot-splash .boot-mark {
        position: relative;
        z-index: 1;
        margin-bottom: 14px;
      }
      #boot-splash .boot-word {
        position: relative;
        z-index: 1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 7px;
        color: #ffffff;
        text-align: center;
      }
      #boot-splash .boot-sub {
        position: relative;
        z-index: 1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 4px;
        color: #00ffff;
        opacity: 0.85;
      }
      #boot-splash .boot-start {
        position: relative;
        z-index: 1;
        margin-top: 32px;
        padding: 13px 48px;
        border: none;
        border-radius: 999px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.3px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #boot-splash .boot-start:active {
        transform: scale(0.96);
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg class="boot-mark" width="72" height="72" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boot-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#b0b5b9" />
            <stop offset="100%" stop-color="#4a4f54" />
          </linearGradient>
        </defs>
        <path d="M 140 210 Q 200 200 240 235 Q 220 285 160 270 Q 130 250 140 210 Z"
              fill="#111111" stroke="url(#boot-chrome)" stroke-width="14" stroke-linejoin="round" />
        <path d="M 360 210 Q 300 200 260 235 Q 280 285 340 270 Q 370 250 360 210 Z"
              fill="#111111" stroke="url(#boot-chrome)" stroke-width="14" stroke-linejoin="round" />
        <path d="M 235 220 Q 250 212 265 220" fill="none" stroke="url(#boot-chrome)" stroke-width="12" stroke-linecap="round" />
      </svg>
      <div class="boot-word">MARVIN</div>
      <div class="boot-sub">AI ASSISTANT</div>
      <button id="boot-start" class="boot-start" type="button">Start</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
