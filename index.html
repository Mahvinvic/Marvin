<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marvin" />
    <title>Marvin — Personal Growth</title>
    <style>
      /* Boot splash: painted before any JS/CSS bundle loads, so there's no
         white flash while the app boots. main.jsx fades it out once the
         visitor taps Start. Just the app logo (favicon.svg) plus Start. */
      html, body {
        background: #0a0a0a;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        background: #0a0a0a;
        transition: opacity 0.4s ease;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-logo {
        width: min(64vw, 280px);
        height: auto;
        display: block;
      }
      #boot-splash .boot-start {
        position: relative;
        z-index: 2;
        padding: 13px 48px;
        border: none;
        border-radius: 999px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.3px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #boot-splash .boot-start:active {
        transform: scale(0.96);
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img class="boot-logo" src="/favicon.svg" alt="Marvin" width="500" height="500" />
      <button id="boot-start" class="boot-start" type="button">Start</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
