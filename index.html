<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marvin" />
    <title>Marvin — Personal Growth</title>
    <style>
      /* Boot splash: painted before any JS/CSS bundle loads, so there's no
         white flash while the app boots. main.jsx fades it out once the
         visitor taps Start. Dark, grainy backdrop with soft ambient glow
         and a phone-frame outline cropped at the bottom edge. */
      html, body {
        background: #08090a;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(120% 120% at 50% 35%, #16181b 0%, #0a0b0d 55%, #030304 100%);
        transition: opacity 0.4s ease;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash::before,
      #boot-splash::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        animation: boot-glow-drift 9s ease-in-out infinite;
      }
      #boot-splash::before {
        width: 380px;
        height: 380px;
        top: -60px;
        left: -70px;
        background: radial-gradient(circle, rgba(96, 116, 138, 0.22), transparent 70%);
      }
      #boot-splash::after {
        width: 420px;
        height: 420px;
        bottom: 20px;
        right: -100px;
        background: radial-gradient(circle, rgba(70, 88, 108, 0.24), transparent 70%);
        animation-delay: -4.5s;
        animation-direction: alternate-reverse;
      }
      @keyframes boot-glow-drift {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.75; }
        50% { transform: translate(26px, 22px) scale(1.18); opacity: 1; }
      }
      #boot-splash .boot-noise {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 0.3;
        mix-blend-mode: overlay;
        pointer-events: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
        background-size: 90px 90px;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash::before,
        #boot-splash::after {
          animation: none;
        }
      }
      #boot-splash .boot-phone {
        position: absolute;
        z-index: 1;
        bottom: -260px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        height: 440px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 36px;
        pointer-events: none;
      }
      #boot-splash .boot-phone::before {
        content: "";
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 46px;
        height: 8px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 5px;
      }
      #boot-splash .boot-start {
        position: relative;
        z-index: 2;
        padding: 13px 48px;
        border: none;
        border-radius: 999px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.3px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #boot-splash .boot-start:active {
        transform: scale(0.96);
        background: #e2e2e2;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-noise"></div>
      <div class="boot-phone"></div>
      <button id="boot-start" class="boot-start" type="button">Start</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
