<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <!-- Chrome Frame Gradient -->
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#b0b5b9" />
      <stop offset="100%" stop-color="#4a4f54" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="90" fill="url(#bg-grad)" />

  <!-- Central AI / Sunglasses Icon Mark -->
  <g transform="translate(0, -20)">
    <!-- Connected Neural Nodes / AI Accent Lines -->
    <path d="M 250 140 L 250 190" stroke="#00ffff" stroke-width="2" opacity="0.6" stroke-dasharray="4 4" />
    <circle cx="250" cy="135" r="3" fill="#00ffff" filter="url(#glow)" />

    <!-- Left Lens Frame -->
    <path d="M 140 210 Q 200 200 240 235 Q 220 285 160 270 Q 130 250 140 210 Z"
          fill="#111111" stroke="url(#chrome-grad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Right Lens Frame -->
    <path d="M 360 210 Q 300 200 260 235 Q 280 285 340 270 Q 370 250 360 210 Z"
          fill="#111111" stroke="url(#chrome-grad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Bridge & Sleek Brow Bar -->
    <path d="M 235 220 Q 250 212 265 220" fill="none" stroke="url(#chrome-grad)" stroke-width="5" stroke-linecap="round" />

    <!-- Subtle AI Glint / Reflection -->
    <path d="M 165 225 L 185 245" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 315 225 L 335 245" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Typography: MARVIN -->
  <text x="250" y="385"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="42"
        font-weight="900"
        letter-spacing="12"
        fill="#ffffff"
        text-anchor="middle">
    MARVIN
  </text>

  <!-- Subtitle: AI ASSISTANT -->
  <text x="250" y="415"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="12"
        font-weight="600"
        letter-spacing="8"
        fill="#00ffff"
        opacity="0.9"
        text-anchor="middle">
    AI ASSISTANT
  </text>
</svg>
